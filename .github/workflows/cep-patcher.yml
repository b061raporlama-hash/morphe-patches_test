name: Cep Patcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manager/**'
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/cep-patcher.yml'
      - 'scripts/cep-*'

permissions:
  contents: read

concurrency:
  group: cep-patcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      _JAVA_OPTIONS: '-Djava.awt.headless=true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the custom patches
        run: |
          chmod +x gradlew manager/gradlew
          java tests/watchlater/WatchLaterRegression.java
          ./gradlew :patches:test :patches:buildAndroid :patches:generatePatchesList --no-daemon --stacktrace -Pversion=1.47.0-cep.${{ github.run_number }}
          mkdir -p dist
          cp patches/build/libs/patches-*.mpp dist/cep-patches.mpp
          cp dist/cep-patches.mpp manager/app/src/main/assets/cep-patches.mpp
          cp patches-list.json dist/patches-list.json
      - name: Restore persistent Cep Patcher signing key
        env:
          CEP_KEYSTORE_B64: ${{ secrets.CEP_KEYSTORE_B64 }}
        run: |
          test -n "$CEP_KEYSTORE_B64" || { echo 'Missing CEP_KEYSTORE_B64 signing secret'; exit 1; }
          printf '%s' "$CEP_KEYSTORE_B64" | base64 --decode > manager/app/keystore.jks
      - name: Test, lint and build the manager with Gradle
        working-directory: manager
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CEP_KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: cep-patcher
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.CEP_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace -Pversion=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/*.apk ../dist/cep-patcher.apk
      - name: Verify APK signature and identity
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/cep-patcher.apk | tee dist/apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging dist/cep-patcher.apk > dist/apk-badging.txt
          grep "package: name='io.github.b061raporlama.ceppatcher'" dist/apk-badging.txt
          grep "application-label:'Cep Patcher'" dist/apk-badging.txt
          python3 scripts/cep-release.py dist --run '${{ github.run_number }}' --sha '${{ github.sha }}' --repo '${{ github.repository }}'
          git archive --format=tar.gz --output=dist/cep-patcher-source.tar.gz HEAD
          (cd dist && sha256sum *.apk *.mpp *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: cep-patcher-release
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: cep-device-tests
          path: |
            manager/app/build/outputs/apk/debug/*.apk
            manager/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cep-check-reports
          path: |
            patches/build/reports/tests/
            manager/app/build/reports/
          if-no-files-found: ignore

  android-loader:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cep-device-tests
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install $(find apks/debug -name '*.apk' | head -1)
            adb install $(find apks/androidTest/debug -name '*.apk' | head -1)
            adb shell am instrument -w io.github.b061raporlama.ceppatcher.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
            ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cep-android-loader-result
          path: instrumentation.txt

  publish:
    needs: [build, android-loader]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: cep-patcher-release
          path: dist
      - name: Publish installable APK, patches, update feeds and corresponding source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create 'cep-v1.0.${{ github.run_number }}' dist/* --target '${{ github.sha }}' --title 'Cep Patcher 1.0.${{ github.run_number }}' --notes-file docs/cep-release-notes.md --latest
